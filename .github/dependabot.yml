version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      test-dependencies:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet.*"]
      database-providers:
        patterns: ["Microsoft.Data.Sqlite", "Npgsql", "Microsoft.Data.SqlClient", "MySqlConnector"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
